<style>

     background:radial-gradient(circle at 30% 25%,#1f2b40,#0f141f 70%)}

.art.p{width:96px;height:128px}

.art.xs{width:33px;height:44px;border-radius:6px}
.art.w{width:100%;aspect-ratio:16/9;height:auto;border-radius:8px;margin-bottom:8px}
.art.w.bban{aspect-ratio:auto;min-height:172px;max-height:none;margin-bottom:0;position:relative;display:flex;flex-direction:column;justify-content:flex-end}
.art.w.bban{height:400px}@media (max-width:720px){.art.w.bban{height:auto}}
.art.w.bban>img,.art.w.bban>.art-fb{position:absolute;inset:0;width:100%;height:100%}
.art .ov-bot.bossov{position:relative;padding:56px 12px 10px;flex-direction:column;align-items:stretch;gap:6px;font-family:var(--mono);font-size:12px}
.bptiles{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:5px;width:80%;margin-left:auto}.bptiles>.art.bt{flex:0 0 auto;width:calc((100% - 40px) / 9)}@media (max-width:900px){.bptiles>.art.bt{width:calc((100% - 20px) / 5)}}@media (max-width:480px){.bptiles>.art.bt{width:calc((100% - 10px) / 3)}}
.art.bt{width:100%;height:min(58px, calc((min(100vw, 1180px) - 110px) / 9 * .45));border-radius:6px;border:1px solid rgba(255,255,255,.1)}@media (max-width:900px){.art.bt{height:min(58px, calc((100vw - 90px) / 5 * .45))}}@media (max-width:480px){.art.bt{height:min(51px, calc((100vw - 70px) / 3 * .45))}}
.art.bt{background:linear-gradient(135deg,rgba(255,120,140,.03),rgba(255,255,255,.01)) #0d0f16;border-color:rgba(255,255,255,.08)}.art.bt .art-fb{color:#8c7880;opacity:.45}.art.bt .art-fb svg .a,.art.bt .art-fb svg .g{fill:#8c7880}

.bossov .bhpl{display:flex;align-items:center;gap:8px}.art .bossov .bhpl .ov-mbar{flex:1 1 auto;height:7px;border-radius:4px}.art .bossov .bhpl .ov-mbar i{box-shadow:0 0 8px rgba(255,95,176,.45)}.art .bossov .ov-mbar i{background:linear-gradient(90deg,var(--red),var(--mag))}        .art.w.bban img{object-fit:cover;object-position:center}

}

const ART_DIR='assets';
const ART_MISS=new Set();
function art(paths, fallbackSvg, size, overlay='', attrs=''){
const srcs=paths.flatMap(p=>[`${ART_DIR}/${p}.webp`,`${ART_DIR}/${p}.png`]).filter(x=>!ART_MISS.has(x));
const fb=!srcs.length;
return `<div class="art ${size} ${fb?'fb':''}" ${attrs}>${fb?'':`<img src="${esc(srcs[0])}" data-srcs="${esc(JSON.stringify(srcs))}" data-i="0" onerror="artErr(this)" alt="">`}<div class="art-fb">${fallbackSvg||''}</div>${overlay}</div>`;
}
function artErr(img){
const srcs=JSON.parse(img.dataset.srcs); let i=+img.dataset.i;
ART_MISS.add(srcs[i]); i++;
while(i<srcs.length && ART_MISS.has(srcs[i])) i++;
if(i<srcs.length){ img.dataset.i=i; img.src=srcs[i]; } else img.parentElement.classList.add('fb');
}

'노아':['장갑판의 표식을 처음 하나 지웠다. 그 손상을 준 적 편대가 격파된 날. 남은 표식이 더 많다.',
'표식이 룬처럼 보이는 이유를 말했다. 어디서 어떻게 다쳤는지 기억하려고 새긴 기호. 읽을 수 있는 건 노아뿐이다.',
'새 장갑을 입을 기회가 왔다. 노아는 옛 장갑판을 안쪽에 덧대고 그 위에 새 판을 올렸다. "지우는 게 아니라 덮는 거야."',
'노아의 장갑판은 이제 두 겹이다. 바깥은 매끈하고 안쪽은 표식으로 가득하다. 격파 사슬의 첫 격파를 노아가 기록한 것도 그 안쪽 어딘가에 있다.'],
'이오':['뒤에 선 소녀들의 이름을 다 기억하는 이유가 나왔다. 이름을 모르는 사람은 지키기 어렵다고.',
'중장기 상대 전문이 된 계기가 있었다. 두꺼운 장갑 뒤에 숨은 적이 편성 하나를 통째로 앗아 간 밤. 이오는 그 뒤로 두꺼운 것부터 뚫는다.',
'검은 장갑에 처음 다른 색이 생겼다. 히카리가 회복 기체로 덧댄 자국. 이오는 지우지 않았다.',
'말 없는 방패가 처음 이름을 불렀다. 편성 전원의 이름을, 출격 전에, 순서대로. 그 뒤로 이오의 편성에서는 아무도 뒤처지지 않는다.'],
'나나':['수리 도크 단골이 처음 손상 없이 돌아왔다. 리벳이 "고장 났나" 하고 기체를 점검했다. 나나는 그냥 웃었다.',
'방패라기보다 망치라는 말을 나나가 직접 정정했다. "망치가 아니라 문이야. 내가 열면 다들 들어오잖아."',
'먼저 적진에 닿는 이유가 밝혀졌다. 뒤에 오는 사람들이 어디를 봐야 하는지 보여 주려고. 폭풍은 방향이 있다.',
'나나는 여전히 첫 번째로 적진에 닿는다. 다만 이제 두 번째가 항상 바로 뒤에 있다. 그 자리는 아야가 맡았고, 둘은 그 얘기를 하지 않는다.'],
'미카':['방어선이 흔들릴 자리를 어떻게 아는지 물었다. "다들 어디를 안 보는지 보면 돼." 그늘에서 기다리는 건 쉬는 게 아니었다.',
'히카리와 짝을 이룬 첫날의 기록이 나왔다. 손실 0%. 그때 미카는 히카리의 이름을 몰랐다.',
'소극적이라는 평가를 미카가 처음 부정했다. "필요할 때만 앞으로 나가는 게 왜 소극적이야." 노바가 그 말을 지휘 교범에 넣었다.',
'그늘은 빛이 있어야 생긴다. 미카는 그 말을 좋아한다. 편성 어디에 있든 미카의 자리는 가장 밝은 소녀 뒤이고, 무너진 적이 없다.'],
'브륀힐데':['뚫린 적이 없다는 전설의 출처를 찾았다. 다른 모함의 방어 기록. 그 모함은 이제 없다.',
'여섯 번째 그림자가 다섯 방패의 이름을 다 알고 있었다. 만나기 전부터. 아야는 그게 어떻게 가능한지 묻지 않았다.',
'요새라는 별칭을 브륀힐데는 싫어한다. "요새는 움직이지 않아. 나는 돌아와." 그날 편성은 요새 잔해를 격파했다.',
'브륀힐데가 있는 편성은 여전히 뚫린 적이 없다. 다만 이제 그건 전설이 아니라 격납고의 기록이고, 그 기록의 첫 줄에는 다섯 이름이 먼저 적혀 있다.'],
'카린':['잔해 회수 버릇의 시작이 밝혀졌다. 처음 주워 온 부품이 손상된 소녀의 수리에 쓰였다. 그 뒤로 빈손으로 돌아온 적이 없다.',
'격전지 재고를 한 번에 싣는 날, 카린의 기체는 가장 느리다. 편성은 카린의 속도로 돌아온다. 아무도 불평하지 않는다.',
'모루라는 별칭이 붙은 이유가 나왔다. 두드려도 부서지지 않아서가 아니라, 위에서 무언가가 만들어지기 때문이라고.',
'카린이 주워 온 부품으로 만든 장비가 편성 절반에 달려 있다. 카린은 그 목록을 갖고 있지 않다. 미오가 대신 세어 두었다.'],
'시아':['"이 정도로 되겠어?"라는 말이 처음 나오지 않은 날. 재고가 바닥이었다. 시아는 빈 화물칸으로 돌아와 하루 종일 도크에 있었다.',
'짐이 무거울수록 비행이 안정된다는 말의 뜻이 밝혀졌다. 가벼울 때 흔들리는 건 기체가 아니었다.',
'고갈된 출격지의 마지막 재고를 시아가 긁어 왔다. 다음 세대가 나타날 때까지 시아는 그 좌표를 매일 확인했다.',
'밸러스트는 배를 가라앉히는 게 아니라 바로 세운다. 시아는 이제 편성이 흔들릴 때 자기가 무엇을 실어야 하는지 안다. 재고만은 아니다.'],
'네온':['길을 잃은 편성을 찾아 데려온 두 번의 기록이 공개됐다. 두 번 다 연료가 바닥 직전이었다. 네온은 그 얘기를 하지 않는다.',
'형광 도색을 직접 골랐다. 어둠 속에서 찾기 쉽게. 자기가 찾기 쉬운 게 아니라 남이 자기를 찾기 쉽게.',
'심우주 관측소 첫 격파 편성에 네온이 있었다. 회수량은 평범했다. 돌아오는 길에 아무도 길을 잃지 않았다는 게 기록의 전부다.',
'표지등이라 불리는 걸 싫어하지 않는 이유를 마지막에 말했다. 자기를 보고 돌아온 사람이 있으니까. 네온의 도색은 이제 격납고 입구 표지판 색이다.'],
'아리사':['코어를 제일 많이 주워 온 비결을 물었다. "부서진 것 중에 안 부서진 걸 찾는 거야." 그 말은 부품 얘기가 아닌 것처럼 들렸다.',
'전투에 약하다는 말을 아리사가 처음 부정하지 않았다. "약해. 그래서 끝난 뒤에 제일 잘 보여."',
'유령 모함 잔해에서 아리사가 골라낸 부품 하나가 격납고의 누구와도 맞지 않았다. 아리사는 그것을 버리지 않고 보관하고 있다.',
'표류물 전문은 여전히 잔해 사이를 뒤진다. 다만 이제 아리사가 가장 먼저 찾는 것은 부품이 아니라 신호다. 살아 있는 것부터.'],
'아카리':['노래로 귀환 시간을 재던 편성이 처음 시간을 틀렸다. 아카리가 한 소절을 건너뛰었다. 그날 회수량은 최고였다.',
'노래의 가사가 처음 알려졌다. 출격지 이름들이었다. 다녀온 곳을 순서대로. 왕복이 길어질수록 노래가 길어진 이유.',
'나룻배라는 별칭을 아카리가 좋아하는 이유. 나룻배는 강을 건너는 게 아니라 사람을 건네준다고.',
'아카리의 노래에는 이제 열두 곳의 이름이 들어 있다. 심연 회랑은 마지막 소절이다. 편성은 그 소절이 들리면 집이 가깝다는 걸 안다.'],
'오르카':['여섯 번째 울림의 무게가 측정됐다. 격납고 바닥 센서가 기록한 값은 다른 프레이터의 두 배였다. 적재량은 같다.',
'거대한 것을 어깨에 진다는 말의 뜻을 카린이 짐작했다. 짐이 아니라 편성을. 오르카가 있는 출격에서 다른 프레이터의 손상이 줄었다.',
'오르카는 다섯 프레이터의 화물칸 배치를 전부 외운다. 누가 어디에 무엇을 싣는지. 미오의 장부보다 정확하다고 미오가 인정했다.',
'어깨에 진 것이 무엇인지 오르카가 처음 말했다. "돌아갈 곳." 프레이터 다섯이 모여 있는 한 그것은 무겁지 않다고 했다.'],
'히카리':['"괜찮아, 아직"을 되풀이하는 습관의 출처가 밝혀졌다. 아직이 아니었던 사람이 있었다.',
'회복 규칙이 바뀐 뒤 히카리의 회복량은 그대로였지만 편성이 달라졌다. 누가 회복을 잘 받는지 히카리가 먼저 편성표를 고쳤다.',
'미카와의 짝이 무너지지 않는 이유를 히카리가 말했다. "미카가 어디 설지 아니까 내가 어디 볼지 알아." 도크에서 리벳이 손을 다친 날 회복 기체를 켰지만 아무 반응이 없었다. 리벳은 "나는 그쪽이 아니야"라고만 했다.',
'빛은 스스로를 비추지 않는다. 히카리는 자기 손상을 마지막에 보고한다. 편성은 그걸 알고 히카리의 기체를 먼저 살핀다.'],
'유메':['적의 손상을 기록하는 이유가 나왔다. 적도 누군가의 편성이었을지 모른다고. 습격 부대의 잔존율이 유메의 보고서에서 처음 의미를 가졌다.',
'"다음엔 덜 다치게 끝내요"가 처음 지켜진 날. 격파는 6라운드였고 손실은 한 자리 수였다. 유메는 그날 보고서를 두 번 썼다.',
'PvP 교전 뒤 유메가 상대 모함의 손실을 기록해 두었다. 보복 출격을 결정할 때 노바가 그 기록을 먼저 읽었다.',
'자비라는 코드는 유메가 고른 게 아니다. 붙여진 것이다. 이제 유메는 그 이름을 부정하지 않는다. 기록은 자비가 남기는 유일한 형태였다.'],
'사요':['수리 시간이 짧아진다는 말이 통계로 확인됐다. 사요가 도크에 있는 날 평균 수리 시간이 확실히 줄었다. 리벳은 "손이 하나 더 있는 셈"이라 했다.',
'회복 기체를 직접 손보는 이유. 자기 기체를 누구보다 잘 알아야 남을 고칠 수 있다고.',
'사요가 도크에서 리벳과 함께 만든 개조가 메딕 전원의 기체에 적용됐다. 이름은 붙이지 않았다.',
'향유는 상처에 바르는 것이다. 사요는 이제 도크에서 기체보다 사람 옆에 더 오래 있다. 수리 시간은 여전히 조금 짧다.'],
'미즈키':['귀환 시각을 외우는 게 아니라 계산하고 있었다는 게 밝혀졌다. 거리, 속도, 연료. 히나가 "나보다 빠르다"고 했다.',
'손상된 소녀의 이름을 첫 번째로 불러 주는 이유. 이름을 불리면 돌아왔다는 걸 안다고.',
'격납고 입구에서 기다리는 자리가 정해졌다. 아무도 정해 주지 않았는데 다들 그 자리를 비워 둔다.',
'피난처는 장소가 아니었다. 미즈키가 입구에 서 있는 한 편성은 어디서든 돌아온다. 손상 편성의 귀환 로그에 미즈키의 이름이 제일 많이 남아 있다.'],
'코토네':['말보다 손이 먼저인 이유가 나왔다. 말이 늦었던 적이 있었다.',
'코토네가 있으면 다들 조용히 버틴다는 말의 뜻. 소란이 없는 게 아니라, 누가 다쳤는지 코토네가 이미 알고 있다는 안심.',
'처음으로 말이 먼저 나온 날. "가지 마." 편성은 출격을 미뤘고, 그날 밤 습격이 왔다. 집에 있던 편성이 막았다.',
'연고는 바르고 나면 보이지 않는다. 코토네의 회복량은 다른 메딕과 같다. 다만 코토네가 있던 편성은 다음 출격에서 덜 다친다. 이유는 아무도 설명하지 못한다.'],
'세라핌':['밤 습격의 손실이 줄어든 이유가 확인됐다. 세라핌은 집에 있을 때 격납고 지붕 위에 기체를 세워 둔다. 레이더보다 먼저 본다.',
'새벽이라는 별칭. 다섯 메딕이 밤을 새운 다음 날 아침에 나타났으니까. 세라핌 본인은 밤이 더 편하다고 한다.',
'세라핌의 회복은 다른 메딕과 같은 규칙을 따른다. 다만 편성 전원이 세라핌을 잘 받는다. 수용률 표에 없는 무언가가 있다고 히카리가 적어 두었다.',
'다섯 메딕이 같은 도크에 있는 밤이면 세라핌은 지붕에 오르지 않는다. 그날은 지킬 필요가 없다는 걸 안다. 새벽은 밤이 끝났다는 신호였다.'],
'레나':['시끄러운 걸 싫어한다는 소문이 반은 맞았다. 시끄러운 게 아니라, 들려야 할 소리가 안 들리는 걸 싫어한다.',
'재밍 안에서 적의 사격이 어긋나는 원리를 레나가 처음 설명했다. 설명은 아무도 이해하지 못했고, 결과는 모두가 봤다.',
'PvP 방어에서 레나의 재밍이 상대 편성의 화력을 깎았다. 상대 기록에는 "원인 불명의 명중률 저하"라고 남았다.',
'정전기는 마찰에서 생긴다. 레나는 편성이 부딪히는 순간마다 거기 있었다. 이제 재머 다섯 중 가장 오래 켜져 있는 것이 레나의 기체다.'],
'쿄코':['모함이 어디 있는지 남이 못 알아보게 하는 데 진지한 이유. 알아본 사람이 찾아온 적이 있다.',
'레이더 은닉 범위가 늘어난 날 쿄코가 처음 웃었다. 남의 눈에 띄는 걸 싫어하는 사람이 웃는 걸 남이 봤다.',
'베일은 가리는 것이지만 쿄코의 베일은 편성을 가린다. 자기 자신은 늘 가장 바깥에 있다.',
'이제 전장 지도에서 이 모함은 잘 보이지 않는다. 쿄코는 그것을 자기 공으로 말하지 않는다. 다만 지도를 볼 때 조금 오래 본다.'],
'아스카':['"교란 개시." 한 번만 나오던 목소리가 두 번 나온 날. 두 번째는 "귀환." 편성은 그날 손실 없이 돌아왔다.',
'필요한 주파수만 쓰는 이유. 나머지 주파수는 듣는 데 쓴다고. 아스카는 편성이 말하지 않은 것을 듣는다.',
'적의 통신이 조용해지는 것과 아군의 통신이 또렷해지는 것은 같은 일이었다. 마리가 그걸 처음 알아냈다.',
'침묵은 비어 있는 게 아니다. 아스카의 편성은 출격 전 아무 말도 하지 않는다. 그 고요가 신호라는 걸 이제 다들 안다.'],
'마리':['습격 유형을 레이더보다 먼저 맞히는 방법. "오는 방향이 아니라 오는 속도를 봐." 그 뒤로 레이더 예측 창이 조금 좁아졌다.',
'정찰 편성을 먼저 알아내는 이유가 밝혀졌다. 정찰 뒤에 본대가 온다는 걸 경험으로 안다. 그 경험의 출처는 묻지 않았다.',
'암호라는 코드가 마리에게 붙은 건 읽어 내기 때문이 아니라 남기기 때문이다. 마리의 보고서는 마리만 다 읽을 수 있다.',
'이제 습격 예고가 뜨면 마리는 유형과 함께 한 줄을 더 붙인다. 어떻게 막을지. 노바는 그 줄을 지휘 판단의 첫 근거로 쓴다.'],
'세츠나':['맞불이라는 말을 세츠나가 정정했다. "불이 아니라 잡음이야. 적이 뭘 말하려는지 안 들리게 하는 거."',
'ECM 방벽이 지어진 날 세츠나가 처음 방벽 앞에 서 있었다. 자기 일이 하나 줄었다는 게 기쁜지 서운한지 알 수 없는 얼굴로.',
'전자전 습격의 첫 라운드를 세츠나가 세 번 연속 지웠다. 적의 교란이 도착하기 전에 사라졌다는 보고서 문구는 그때 굳어졌다.',
'잡음은 아무 뜻이 없어야 한다. 세츠나의 교란은 아무 뜻이 없는 소리를 정확히 만든다. 그게 얼마나 어려운지 재머들만 안다.'],
'에코':['여섯 번째 기체가 응답한 주파수가 밝혀졌다. 다섯 재머 중 누구도 쓰지 않는 주파수. 다섯의 교란이 겹칠 때만 열리는 틈.',
'메아리는 원래 소리가 있어야 생긴다. 에코는 다섯 재머 중 하나라도 편성에 없으면 조용하다.',
'에코가 처음 자기 소리를 냈다. 습격 부대의 유형 판별이 틀렸을 때. 마리도 놓친 것을 에코가 잡았다.',
'고요 속에서 응답한 기체는 이제 모함의 모든 신호를 듣는다. 에코는 그 중 어떤 것도 밖으로 내보내지 않는다. 메아리는 돌아오는 소리다.'],
'루나':['설계도가 가장 먼저 복원된 이유. 조선소 잔해에서 루나의 설계도가 가장 온전했다. 다른 기함의 설계도는 루나의 것을 참조해 복원됐다.',
'연료가 덜 들고 덜 다치는 것이 지휘라는 말을 루나가 정정했다. "지휘는 돌아오게 하는 거야. 나머지는 결과."',
'심연 회랑 깊은 티어에서 루나가 처음 편성을 후퇴시켰다. 격파는 못 했다. 손실도 없었다. 노바는 그 판단을 기록에 남겼다.',
'아이기스는 방패의 이름이다. 루나가 편성에 있으면 다들 덜 다친다는 것을 이제 아무도 지휘 보정이라 부르지 않는다. 루나가 앞에 있기 때문이라고 말한다.'],
'에리스':['지휘 주파수 안에서 적의 전자전이 닿지 않는 원리를 재머들이 궁금해했다. 에리스는 "내가 더 크게 말하는 것뿐"이라 했다.',
'전자전 습격이 잦은 구역에서 에리스가 지휘한 편성은 한 번도 1라운드를 잃지 않았다.',
'봉화는 멀리서 보라고 켜는 것이다. 에리스의 지휘 신호는 편성 밖에서도 잡힌다. 길을 잃은 다른 편성이 그 신호로 돌아온 적이 있다.',
'에리스는 이제 출격 전 통신을 자기가 열지 않는다. 아스카가 열고 에리스가 받는다. 두 목소리가 겹치는 편성에서 적의 교란은 도착하지 않는다.'],
'카나':['적의 기함이 먼저 카나를 노린다는 걸 알고도 앞에 서는 이유. "그래야 다른 애들이 안 맞으니까." 아야가 그 말을 듣고 카나 옆에 섰다.',
'3칸을 차지하는 존재감이 격납고 확장의 이유가 됐다. 격납고 레벨이 오를 때마다 하르파가 카나의 자리를 먼저 잡아 준다.',
'왕관은 무겁다. 카나가 손상을 입고 돌아온 날 수리 시간이 가장 길었다. 그 사이 편성은 카나 없이 두 번 나갔고, 두 번 다 카나의 배치를 그대로 썼다.',
'가장 무거운 기체는 이제 편성의 중심이 아니라 기준이다. 카나가 어디 서는지 정해지면 나머지가 정해진다. 왕관은 쓰는 게 아니라 놓는 자리였다.'],
'리나':['라운드별 손실이 가장 고른 이유를 리나가 말했다. "누가 다칠지 정하는 게 아니야. 아무도 혼자 다치지 않게 하는 거지."',
'칙령이라는 코드를 리나는 좋아하지 않는다. 명령대로 움직이는 게 아니라, 움직이는 대로 명령을 맞춘다고.',
'리나의 배치표가 편성 전체의 기본 배치가 됐다. 추천 편성이 리나의 배치를 참고한다는 걸 아는 사람은 적다.',
'누가 앞에 서고 누가 물러설지를 정하던 사람이 이제 스스로 물러서는 법을 배웠다. 리나가 뒤로 갈 때 편성은 그게 신호라는 걸 안다.'],
'메이':['편성 소녀들이 메이를 지키려 하는 이유를 메이가 처음 물었다. 답은 없었다. 대신 다음 출격에서 메이가 맨 앞에 섰고, 다들 따라갔다.',
'가장 어린 플래그십의 지휘 보정은 다른 기함과 같다. 다만 메이가 지휘한 편성의 귀환 시각이 가장 정확하다. 늦게 온 적이 없다.',
'설계도가 마지막으로 복원된 이유가 밝혀졌다. 조선소에서 메이의 설계도는 가장 깊은 곳에 있었다. 누군가 숨겨 둔 것처럼.',
'깃발은 앞에서 흔드는 것이다. 메이는 이제 지켜지지 않는다. 지킨다. 편성이 메이를 보는 이유는 어리기 때문이 아니라 거기 깃발이 있기 때문이다.'],
'아르테미스':['지휘 계통 맨 위의 이름이 어디서 왔는지 노바가 조사했다. 이 모함의 원래 지휘 계통도에 그 이름이 있었다.',
'다섯 기함이 한 모함에 모이는 일이 드문 이유. 기함은 서로를 필요로 하지 않는다. 아르테미스가 나타난 뒤 다섯은 서로를 필요로 하기 시작했다.',
'여제라는 별칭을 아르테미스는 한 번도 쓰지 않았다. 지휘 통신에서 자기를 "여섯 번째"라 부른다.',
'다섯 기함이 모두 출격한 날, 아르테미스는 모함에 남았다. 돌아온 편성이 격납고에서 본 것은 지휘 계통도의 맨 위가 비어 있고, 그 자리에 다섯 이름이 나란히 적힌 것이었다.'],
'키라':['포탑이 먼저 침묵한다는 말이 처음 틀린 날. 요새 잔해의 포탑이 두 라운드를 버텼다. 키라는 그날 이후 첫 라운드를 두 번 쏜다.',
'시설 상대 화력 ×2의 원리. 키라는 구조물의 이음새를 본다. 어디를 치면 무너지는지, 어디를 치면 안 무너지는지.',
'성벽 파쇄라는 코드를 키라가 처음 아쉬워했다. "부수는 것만 잘하는 사람처럼 들려." 그날 키라는 격납고 벽을 고쳤다.',
'요새 잔해 위에 키라의 표식이 있다. 격파한 포탑 수가 아니라 살려 둔 구조물 수. 무엇을 부수지 않을지 아는 것이 공성의 마지막 장이었다.'],
'토카':['군집 드론 상대를 다른 소녀에게 맡긴다는 말이 처음 깨졌다. 다른 소녀가 없던 날. 토카는 느린 포로 여섯 라운드를 버텼다.',
'시즈 포가 한 번 울리면 기함 장갑에 구멍이 난다. 두 번 울린 적은 없었다. 두 번째가 필요한 적이 없었다는 뜻이라고 토카는 말했다.',
'일제 사격의 타이밍을 리나가 물었다. 토카의 답. "다들 숨을 참는 순간." 리나는 그것을 배치표에 적을 수 없었다.',
'느리다는 말은 이제 토카 앞에서 나오지 않는다. 한 번에 크게가 아니라 한 번이면 된다는 것을 편성이 알았다. 토카의 포는 여전히 한 번만 울린다.'],
'미레이':['예상 밖 각도의 출처가 밝혀졌다. 미레이는 출격 전 전장 지도를 뒤집어 본다. 적이 보는 방향에서.',
'곡사로 시설 뒤를 친다는 것은 정면의 소녀들이 시간을 벌어 준다는 뜻이다. 미레이는 그 시간을 라운드 수로 정확히 안다.',
'방어 포탑이 많은 출격지에서 미레이가 먼저 무너뜨린 것은 포탑이 아니라 포탑이 보는 방향이었다. 보고서는 그것을 적지 못했다.',
'박격은 보이지 않는 곳을 친다. 미레이는 이제 편성이 보지 못하는 곳도 본다. 습격 예고에 미레이의 한 줄이 붙기 시작했다. 어디서 올지.'],
'유나':['기함 급습을 두 번 막아 낸 뒤 세 번째가 왔다. 유나는 그날 손상을 입었다. 막았다.',
'시즈의 장갑이 얇다는 것을 유나는 안다. 그래서 기함 앞에 서기를 자청하는 이유. "얇은 게 앞에 있으면 적이 거기만 봐."',
'성채라는 별칭을 유나가 처음 받아들였다. 아야가 "너는 벽이 아니라 문루야"라고 했을 때.',
'시즈 중 가장 두꺼운 마음가짐은 여전히 유나다. 이제 유나 앞에 불워크가 선다. 유나는 물러선 게 아니라 자리를 바꾼 것이라고, 아무도 묻지 않았는데 말했다.'],
'아이':['기체에 새긴 격파 시설 수가 세 줄째가 됐다. 신입이라는 말이 사라졌다.',
'말이 없고 기록만 남기는 이유가 한 줄로 나왔다. "말은 남지 않으니까요."',
'아이의 기체에 다른 글자가 새겨졌다. 격파 수가 아니었다. 편성 소녀들의 이름 첫 글자. 아이는 그것을 설명하지 않았다.',
'이름이 짧은 만큼 사격도 짧다. 아이의 기록은 이제 넉 줄이고, 마지막 줄은 비어 있다. 무엇을 적을지 정해 두었다고 한다.'],
'이졸데':['여섯 번째 포성의 위치가 특정됐다. 요새 잔해 반대편. 다섯 공성 기체가 보지 못한 곳.',
'종말의 포성이라는 별칭. 이졸데는 포를 쏘지 않는 날이 더 많다. 그날들이 종말이 오지 않은 날이라고 한다.',
'유령 모함 교전에서 이졸데가 한 번 쏘았다. 모함이 침묵했다. 보고서의 라운드 수는 1이었다.',
'다섯 시즈가 요새 잔해 위에 다시 나란히 선 날, 이졸데는 그들 사이에 있었다. 여섯 번째 포성은 이제 어디선가 울리지 않는다. 편성 안에서 울린다.'],
'니나':['레이더가 닿지 않는 곳의 적을 미리 보는 방법. 니나는 적을 보는 게 아니라 적이 남긴 것을 본다. 항적, 잔해, 온도.',
'방향을 잡는다는 것은 돌아올 방향도 잡는다는 뜻이다. 니나의 편성은 왕복 시간이 조금 짧다. 길을 덜 헤맨다.',
'정찰 전문이 처음 전투에서 사격했다. 편성 뒤를 노린 드론. 니나는 그날 자기 화력이 얼마인지 처음 확인했다.',
'벡터는 크기와 방향을 가진다. 니나는 이제 편성이 어디로 가는지뿐 아니라 얼마나 가야 하는지도 먼저 말한다. 추천 편성이 니나를 먼저 넣는 이유다.'],
'리코':['냄새로 안다는 주장이 검증됐다. 심연 회랑 깊은 티어에서 리코가 가리킨 곳에 보상이 있었다. 세 번 연속.',
'심연 티어 보상을 더 끌어내는 감각의 대가. 리코는 회랑에서 돌아오면 하루 동안 말을 하지 않는다.',
'나침반은 북쪽을 가리키지만 리코의 나침반은 깊이를 가리킨다. 모모가 "그건 나침반이 아니라 측심기"라 했고 리코는 이름을 바꾸지 않았다.',
'심연 회랑의 가장 깊은 기록은 리코가 있던 편성의 것이다. 리코는 그 깊이에 무엇이 있었는지 말하지 않는다. 다음에 다시 갈 것이라고만 한다.'],
'모모':['전장 지도의 좌표가 모모가 읽어 준 숫자라는 설정이 사실이 됐다. 지도 갱신이 늦은 날 모모가 좌표를 불렀고, 정확했다.',
'별을 보고 위치를 안다는 것은 별이 안 보이면 모른다는 뜻이다. 심연 회랑에서 모모는 처음 좌표를 놓쳤다. 치카의 등불이 대신했다.',
'육분의는 각도를 잰다. 모모는 모함과 출격지 사이의 각도를 안다. 모함이 움직이는 방향을 노바보다 먼저 맞힌 적이 있다.',
'모모의 좌표 기록은 이제 항해 일지의 한 부분이다. 노바가 그것을 정식으로 요청했다. 별을 보는 소녀가 지도를 만들었다.'],
'아즈사':['유령 모함의 위치를 처음 보고한 날의 기록. 아즈사는 편성 없이 혼자 나가 있었다. 그 뒤로 혼자 나가는 것이 금지됐다.',
'위험 구역에 들어설 때 편성이 아즈사를 먼저 부르는 이유. 아즈사가 있으면 어디가 위험한지가 아니라 어디가 안전한지를 안다.',
'남이 안 간 길을 먼저 밟는다는 것의 대가. 아즈사의 기체에는 다른 소녀들이 모르는 손상 흔적이 있다. 리벳만 안다.',
'발자국은 뒤에 남는다. 아즈사가 밟은 길을 이제 편성이 따라간다. 전장 지도의 안전 항로 절반은 아즈사의 발자국이다.'],
'치카':['꺼지면 돌아올 길이 없다는 말을 치카가 정정했다. "꺼지면 내가 돌아올 길이 없어. 다들은 내가 알려 줄 거야."',
'등불이 꺼진 적 없는 이유. 치카는 편성의 연료를 자기가 마지막에 쓴다. 그래서 늘 가장 늦게 돌아온다.',
'심연 회랑 깊은 티어에서 치카의 등불이 처음 흔들렸다. 리코가 방향을, 모모가 좌표를, 니나가 거리를 불렀다. 등불은 꺼지지 않았다.',
'어두운 회랑에서 편성을 이끄는 등불은 이제 하나가 아니다. 패스파인더 다섯의 기체에 모두 등불이 달렸다. 치카가 달아 주었다. 자기 것이 꺼져도 되도록.'],
'카시오페아':['모두의 나침반이 같은 곳을 향한 밤의 좌표가 기록에 있다. 그 좌표는 지금 심연 회랑의 입구다.',

'다섯 탐사기가 서로 다른 별을 가리키던 이유가 밝혀졌다. 다섯이 각자 옳았다. 카시오페아는 그 다섯 방향의 가운데였다.',
'카시오페아는 길을 가리키지 않는다. 다섯 패스파인더가 각자 가리킨 길이 어디서 만나는지를 안다. 심연의 가장 깊은 곳에 대해 카시오페아가 남긴 말은 하나다. "거기도 집이 보여."'],

const KEEPER_CH = {
navlab:['첫 항법 연구가 끝난 날, 출격 편성의 귀환이 예정보다 몇 분 일렀다. 아무도 눈치채지 못했고 아스트라만 기록했다. "2%야." 노바가 물었다. "그게 다야?" 아스트라는 항로표를 접었다. "매번."',
'통제실을 올리려던 노바가 처음으로 제지당했다. "항법이 아직이야." 노바는 진로를 정하는 사람이 진로의 상한을 남에게서 듣는 기분을 그날 처음 알았다. 소나가 웃었다. 소나도 다음 주에 같은 말을 듣게 된다.',

mlab:['정비 공학 첫 결과가 나온 날, 리벳은 수리 순서표 끝에 마이카의 메모가 붙은 것을 봤다. "4%." 리벳이 공구를 내려놓았다. "내 손이 빨라진 거야, 네 종이가 빨라진 거야?" 마이카는 대답 대신 순서표 한 줄을 지웠다. 줄이 한 칸 짧아졌다.',

lab:['첫 연구가 끝난 날 베릴은 결과표를 정련로 벽에 붙였다. 아그니는 그것을 떼지 않았다. 숫자가 3% 올랐다는 것보다, 누가 재고 있다는 것이 화구 앞의 사람에게는 위안이었다.',
'발전소를 더 올리려는 엘렉트라를 베릴이 막았다. "리액터 공학이 아직이야." 엘렉트라는 처음으로 자기 건물의 상한을 남에게서 들었다. 그날 밤 둘은 같은 도표를 두 번 다시 그렸다.',
'옵시디언. 검은 유리. 베릴은 다른 담당들과 같은 머리색이지만, 연구 기록의 서명은 매번 조금씩 다르다. 배우는 방식이 다르다고 미네르바가 말한 그 담당들 중에서, 베릴만이 배운 것을 종이에 남긴다.'],
refinery:['두 번째 화구를 점화한 날, 아그니는 첫 화구 앞에서 밤을 보냈다. "기다리는 일"이라는 말이 어디서 나왔는지 그날 알 수 있었다. 첫 화구는 한 번 꺼진 적이 있다.',
'정련로가 커질수록 스크랩이 모자란다. 아그니는 출격지 재고표를 정련로 벽에 붙였다. 소녀들이 실어 오는 것과 자기가 녹이는 것이 같은 숫자라는 걸 보이려고.',
'포르나크스는 화로라는 뜻이다. 아그니는 이제 정련로 레벨이 오를 때 화구가 아니라 이름을 하나 새긴다. 그 레벨에 가장 많이 실어 온 소녀의 이름. 벽은 아직 넉넉하다.'],
partsfab:['부품이 남는다는 말이 처음 사라진 날. 수리와 장비가 부품을 다 먹었다. 테스라는 라인을 하루 더 돌렸고, 남는 부품이 다시 생겼을 때 기뻐했다.',
'서보 하나가 규격을 벗어났다. 테스라는 그것을 버리지 않고 아리사에게 주었다. "맞는 데가 있을 거야." 아리사는 아직 찾고 있다.',
'코일만이라는 성은 감는 사람이라는 뜻이라고 테스라는 말한다. 부품이 남으면 기뻐하는 이유가 마지막에 나왔다. 남는 것이 있어야 다음이 있으니까. 라인은 지금도 돌아간다.'],
fuelsyn:['전력을 많이 먹는다는 잔소리가 다시 나왔다. 나프타는 대답 대신 순항 연료 게이지를 가리켰다. 그날 모함은 멈추지 않았다.',
'합성 화학관의 연료는 순항에만 쓰이지 않는다. 출격 편성의 연료도 여기서 나온다. 나프타는 출격 슬롯이 늘어날 때마다 합성조를 하나 더 청구한다.',
'크라켄버그. 깊은 데서 끌어올리는 사람. 나프타의 합성조는 이제 모함의 항속 거리다. 어디까지 갈 수 있는지를 나프타가 정하고, 어디로 갈지는 여전히 운이 정한다.'],
reactor:['발전소 증설을 요구하는 방식이 바뀌었다. 문서 대신 숫자 하나. 전력 비율. 그 숫자가 100 아래로 내려가면 엘렉트라는 말을 하지 않는다. 그게 더 무섭다.',
'언니가 만든 전력으로 동생이 채운 창고가 처음 넘치지 않은 날. 둘은 같은 표정으로 한숨을 쉬지 않았다. 대신 같은 표정으로 다음 레벨 비용을 봤다.',
'볼트하임. 번개의 집. 엘렉트라는 발전소가 커질 때마다 동생 창고 쪽으로 배선을 하나 더 낸다. 넘치는 것을 버리지 않으려고. 두 자매의 건물은 이제 벽을 공유한다. 자매라는 말은 둘이 스스로 붙였다. 같은 날 켜진 두 기관이 서로를 그렇게 부르기로 한 것이다.'],
depot:['"다녀왔어?"라고 묻는 사람이 처음 다른 말을 했다. "어디 다쳤어?" 창고가 가득 찬 날이 아니라 편성이 손상을 입고 돌아온 날이었다. 그날 유즈가 알아챘다 — 사가와 엘렉트라는 자매라서 닮았다는데, 머리색은 도크의 리벳도, 포탑의 발리스타도 같다.',
'언니에게 창고를 키워 달라고 조르는 대신 사가가 직접 비용을 모았다. 남는 자원을 교환소에 넘겨서. 마르셰가 "동생 쪽이 더 무섭다"고 했다.',
'창고 레벨과 장부는 여전히 사가의 것이다. 이제 장부 마지막 장에는 자원이 아니라 이름이 있다. 미오의 장부와 같다. 둘은 서로의 장부를 본 적이 없다.'],
dock:['수리 순서를 정하는 기준이 처음 공개됐다. 손상이 큰 순서가 아니었다. 다음 출격에 필요한 순서. 리벳은 "다 고쳐. 순서만 정하는 거야"라고 했다.',
'유즈가 도크 청소를 대신했다는 게 밝혀진 날 리벳은 웃었다. 수리 순서를 앞당긴 적은 없다. 대신 유즈가 원하는 소녀의 기체를 밤에 먼저 봤다. 그 밤 유즈는 리벳이 자기 손목을 열어 서보를 조이는 것을 봤다. 리벳은 "직업병"이라고만 했다.',
'해머슈타인. 두드리는 돌. 정비 반장의 손은 이제 도크 밖에도 닿는다. 건설이 빨라진 건 리벳의 손이 빨라져서가 아니라, 리벳이 가르친 손이 늘어서다.'],
hangar:['히든이 나타나는 순간을 세 번째 봤다. 하르파는 이번엔 그 자리를 미리 비워 두었다. 어떻게 알았는지는 말하지 않는다.',
'칸을 배정하는 관제관이 처음 칸을 거절했다. 명단이 다 찬 클래스의 새 소녀. "자리는 있어. 그런데 이 애가 있을 이유가 없어." 그 소녀는 재료가 되었고 하르파는 그날 기록을 남기지 않았다.',
'베이록. 만(灣)의 바위. 격납고는 소녀들이 돌아올 유일한 집이고, 하르파는 그 집의 문지기가 아니라 방을 세는 사람이다. 빈 방은 아직 있다. 하르파는 그것을 좋은 일이라 한다.'],
command:['경유지는 운이 정한다. 노바는 그 운을 기록한다. 항해 일지의 경유지 목록이 열 장을 넘었을 때 패턴이 하나 보였다. 노바는 아직 확신하지 않는다.',
'동시 출격 슬롯이 늘어나자 노바가 처음 한 일은 슬롯을 비워 두는 것이었다. 귀환 명령용. "나갈 자리보다 돌아올 자리가 먼저야."',
'스텔라리스. 별의. 항해 지휘관은 진로를 정하지 못한다. 대신 어디서든 돌아오는 항로를 안다. 전장 지도의 항적은 노바가 걸어온 길이 아니라 소녀들이 돌아온 길이다. 항해 일지 첫 장의 승무원 명단에 사람은 없다. 담당 열여섯은 모함의 설비 목록에 적혀 있다. 노바는 그 장을 찢지 않았다.'],
academy:['"출격이 못 가르치는 건 반복"이라는 말이 처음 시험받았다. 훈련만으로 레벨을 올린 소녀가 실전에서 흔들렸다. 미네르바는 훈련 과목에 "돌아오기"를 넣었다.',
'동시 훈련 슬롯이 늘자 미네르바는 소녀들을 짝으로 앉혔다. 시뮬레이터는 혼자 하는 것이지만 옆에 누가 있는지는 다르다고. 담당 소녀들은 시뮬레이터에 앉지 않는다. 미네르바의 말로는 "우리는 배우는 방식이 달라".',
'아카데미아. 미네르바의 훈련장은 이제 신입만 오는 곳이 아니다. 후속 이야기가 열리지 않은 소녀들이 레벨을 올리러 온다. 미네르바는 그것을 이야기를 사러 온다고 표현한다.'],
market:['"공짜는 없어요"가 인사말인 상인이 처음 공짜를 내놨다. 습격에 뚫린 날. 환율표를 하루 접었다. 다음 날 환율은 그대로였다.',
'교환 한도를 채운 날 마르셰는 창고 쪽을 봤다. 사가가 남는 자원을 가져오는 시간이 정확했다. "동생 쪽이 더 무서워요"라는 말은 그때 나왔다.',
'탈렌토. 재능이 아니라 저울의 무게 단위다. 마르셰의 교환소는 이제 자원만 바꾸지 않는다. 다른 모함의 소식이 여기서 제일 먼저 돈다. 물론 공짜는 아니다.'],
turret:['선제 사격 신호가 처음 늦은 날. 발리스타는 신호를 안 보냈다. 습격 부대가 정찰 편성이었고, 쏘면 본대가 온다는 걸 마리가 먼저 말했다. 그날 처음 이 얘기가 나왔다 — 발리스타·플뢰르·볼타 셋을 소녀들은 쌍둥이라 부른다. 틀린 말은 아니라고 발리스타는 웃었다.',
'포탑 내구도 수리비를 직접 청구하는 이유. 청구서를 보면 다들 방어 건물이 공짜가 아니라는 걸 안다고. 발리스타의 청구서는 격납고 벽보 옆에 붙는다.',
'캐논데일. 포의 골짜기. 포격 지휘관의 신호는 이제 습격 때만 울리지 않는다. 편성이 돌아올 때 한 번. 발리스타는 그것을 예포라고 부르지 않는다. 확인 사격이라고 한다.'],
flak:['군집 드론이 몰려온 밤 플뢰르의 기관포가 두 배로 일했다. 아침에 탄창이 비어 있었고 플뢰르는 잠들어 있었다. 리벳이 기관포를 먼저 손봤다.',
'스트라이커 무리를 상대할 때 두 배로 일한다는 것은 PvP 방어에서 처음 의미를 가졌다. 상대 편성의 스트라이커가 플뢰르의 사거리에서 흩어졌다. 그 밤 세라핌이 지붕에서 플뢰르를 볼타라고 잘못 불렀다. 플뢰르는 고치지 않았다. 셋 중 누가 대답해도 같은 대답이 나온다는 걸 알기 때문이다.',
'스카이릿. 작은 하늘. 플뢰르의 기관포는 무리를 상대한다. 하나씩이 아니라 한꺼번에. 그래서 플뢰르는 편성이 무리로 돌아오는 것을 가장 좋아한다.'],
railgun:['장포신이 울리는 날은 기함 급습이 있는 날. 볼타는 그 날을 미리 안다. 레일건 충전에 시간이 걸려서, 예고를 보고 충전을 시작하기 때문이다.',
'중장기와 기함을 뚫는 레일건이 처음 빗나갔다. 볼타는 다음 습격까지 조준 기록을 다시 계산했다. 마리가 습격 속도를 알려 줬고, 그 뒤로 빗나가지 않았다.',
'레일가르드. 궤도를 지키는 사람. 볼타의 장포신은 이제 습격에만 울리지 않는다. 심우주 관측소 첫 격파 보고가 들어온 날 한 번 울렸다. 확인 사격은 발리스타의 것이지만, 축포는 볼타의 것이다. 레일가르드라는 성은 볼타가 스스로 골랐다. 같은 틀에서 나온 셋이 이름만은 각자 고르기로 한 밤이 있었다.'],
ecm:['재머 소녀들과 주파수로만 대화한다는 농담이 사실이었다. 사일런은 격납고에서 재머들을 만난 적이 없다. 습격 때 교란이 겹치면 그것이 인사다.',
'전자전 습격이 도착하기 전에 지워졌다는 보고서 문구가 굳어진 날, 세츠나가 ECM 방벽 앞에 서 있었다. 사일런은 방벽 안에서 처음 밖을 봤다.',
'뮤트너. 소리를 죽이는 사람. 전파 관제사의 방벽은 이제 모함을 감싸는 것이 아니라 모함이 내는 소리를 고른다. 쿄코의 베일과 겹치면 전장 지도에서 이 모함은 거의 보이지 않는다.'],
radar:['소나의 스코프에 처음 잡힌 다른 모함. 그날 밤 소나는 스코프 앞을 떠나지 않았다. 다음 날 아침 그 모함은 사라졌고, 소나는 그 좌표를 지우지 않았다.',
'레이더 레벨이 오를 때마다 눈이 닿는 거리가 늘어난다. 소나는 늘어난 거리만큼 먼저 본 것을 기록한다. 대부분은 아무것도 아니다. 그 "아무것도 아닌 것"의 목록이 가장 길다.',
'에코라인. 메아리가 돌아오는 선. 탐지 관측사의 스코프에는 이제 열두 출격지와 다른 모함들과 심연 회랑의 입구가 있다. 소나가 아직 보지 못한 것은 한 가지다. 이 모함이 어디서 출발했는지. 대신 하나는 안다 — 열여섯 담당의 기동 기록은 모두 같은 날, 같은 시각이다.'],
vault:['습격이 뚫린 날 베르타의 금고 안 것은 나가지 않았다. 나간 것은 금고 밖의 것이었다. 베르타는 그날 처음 금고 밖을 셌다.',
'보호 비율이 오르자 베르타는 사가에게 창고의 어느 칸을 금고로 옮길지 물었다. 사가의 답. "다녀온 애들이 실어 온 것부터."',
'세이프홀트. 지켜지는 곳. 베르타의 금고는 약탈에서 자원을 지킨다. 이제 그 안에는 자원 외의 것이 하나 있다. 유키가 찾은 명찰. 이름이 지워진 그것을 베르타가 보관하기로 했다. "맡겨 두세요. 금고는 잊지 않습니다."'],
};

function growth(g){

let rarLv=0, potLv=0, eqLv=0;
if(g.rar==='S') nextRar='최대';
else { if(L<RANK_LV[RANK[rarStep+1]]) rarLv=RANK_LV[RANK[rarStep+1]];

function achSpeaker(txt){ const m=/— ([^"']+)\s*$/.exec(txt||''); if(!m) return null; const nm=m[1].trim(), kid=KEEPER_BY_NAME[nm]; if(kid) return {kind:'keeper', key:kid, path:`buildings/${kid}`, icon:ICON[kid]}; const o=OFFICERS.find(x=>x.name===nm); return o? {kind:'officer', key:o.id, path:`officers/${o.name}`, icon:ICON[o.icon]||''} : null; }
function achKeeper(a){ const sp=achSpeaker(a.quote); return sp&&sp.kind==='keeper'? sp.key : null; }
function achSay(bid, got, n, unc){ const L=ACH_SAY[bid]||['','','','']; const t= got>=n? L[3] : unc? L[1] : got? L[2] : L[0]; return t.replace('{got}',got).replace('{n}',n).replace('{unc}',unc); }

{id:'h_bond1', cat:'hangar', name:'첫 서약', cond:'소녀 하나 유대 「서약」', need:()=>[S.girls.filter(g=>bondLv(g)>=BOND_LV.length).length,1], pre:'"서약까지 간 아이는 아직 없다." — 하르파', quote:'"서약은 격납고 기록에 남지 않는다. 그래서 내가 대신 적어 둔다." — 하르파', reward:{cores:1}},
{id:'h_bond5', cat:'hangar', name:'다섯 서약', cond:'유대 「서약」 5명', need:()=>[S.girls.filter(g=>bondLv(g)>=BOND_LV.length).length,5], pre:'"한 명이면 인연, 다섯이면 지휘관의 성격." — 하르파', quote:'"다섯 명이 같은 말을 했다. 이건 우연이 아니라 지휘관의 성격이다." — 하르파', reward:{cores:2}},

{id:'s_first', cat:'sortie', name:'첫 출격', cond:'편성 출격 1회', need:cnt('sortie',1), pre:'"첫 출격. 돌아오는 항로는 내가 그려." — 노바', quote:'"첫 항로. 근교라도 좋아 — 레이더에 점 하나가 움직이기 시작했다." — 소나', reward:{fuel:500}},

{id:'s_win10', cat:'sortie', name:'열 번의 귀환', cond:'출격 격파 10회', need:cnt('sortieWin',10), pre:'"격파 열 번. 예고는 제때 할게." — 소나', quote:'"열 번. 예상과 결과의 차이를 적기 시작했다." — 소나', reward:{fuel:1500}},
{id:'s_far', cat:'sortie', name:'잔해장의 첫 발', cond:'격전지 잔해장 격파', need:wn('far',1), pre:'"격전지 잔해장. 합금이 많이 들어와 — 상한 확인해." — 사가', quote:'"격전지의 잔해를 처음 밟았다. 다음은 광맥이다." — 소나', reward:{fuel:2000}},

{id:'s_win150', cat:'sortie', name:'백오십 번의 귀환', cond:'출격 격파 150회', need:cnt('sortieWin',150), pre:'"격파 백오십. 귀환 신호를 세다 잠든 적도 있어." — 소나', quote:'"백오십 번. 돌아오는 순서까지 외워 버렸다." — 소나', reward:{cores:1}},
{id:'s_win200', cat:'sortie', name:'이백 번의 귀환', cond:'출격 격파 200회', need:cnt('sortieWin',200), pre:'"격파 이백 번. 그쯤이면 내가 배워." — 소나', quote:'"이백 번. 레이더는 이제 내 눈이 아니라 습관이다." — 소나', reward:{cores:2}},

{id:'f_def50', cat:'field', name:'쉰 번의 격퇴', cond:'습격 격퇴 50회', need:cnt('raidWin',50), pre:'"격퇴 쉰 번. 습격 유형 복기가 끝난다." — 미네르바', quote:'"쉰 번. 포격 지휘관이 아니라 요새 관리인이 된 기분이다." — 발리스타', reward:{cores:1}},
{id:'f_def75', cat:'field', name:'일흔다섯 번의 격퇴', cond:'습격 격퇴 75회', need:cnt('raidWin',75), pre:'"일흔다섯 번. 습격 부대가 우리 사거리를 외웠을 거야." — 플뢰르', quote:'"일흔다섯. 경보 소리가 이제 박자처럼 들린다." — 발리스타', reward:{cores:1}},

{id:'f_surprise', cat:'field', name:'기습', cond:'탐지 범위 밖에서 출발한 약탈로 성공', need:cnt('pvpSurprise',1), pre:'"탐지 범위 밖에서 출발해 돌파. 전파를 죽이고 가." — 사일런', quote:'"당직만 나온 집을 뚫었다. 레이더 밖에서 출발한 게 답이었다." — 발리스타', reward:{cores:1}},
{id:'f_partial', cat:'field', name:'6라운드의 벽', cond:'부분 돌파 1회', need:cnt('pvpPartial',1), pre:'"6라운드를 버틴 벽을 일부라도 넘어라." — 발리스타', quote:'"다 못 죽였지만 뚫린 걸로 친다. 다음엔 한 라운드 더." — 발리스타', reward:{fuel:3000}},
{id:'f_revenge', cat:'field', name:'되갚음', cond:'보복 출격으로 성공', need:cnt('revengeWin',1), pre:'"맞았으면 되갚아. 언니들이 먼저 나서겠지만." — 플뢰르', quote:'"나를 친 손을 돌려줬다. 보복권은 한 번뿐이라 더 달다." — 발리스타', reward:{cores:1}},
{id:'f_revenge3', cat:'field', name:'세 번의 되갚음', cond:'보복 출격으로 성공 3회', need:cnt('revengeWin',3), pre:'"세 번 되갚으면 먼저 치는 쪽이 망설여." — 플뢰르', quote:'"세 번. 보복권이 경고장이 되었다." — 발리스타', reward:{cores:1}},
{id:'f_hold', cat:'field', name:'집을 지킨 날', cond:'플레이어 약탈 격퇴 1회', need:cnt('defWin',1), pre:'"플레이어의 약탈을 격퇴하시면, 금고는 그날 잠겨 있을 거예요." — 베르타', quote:'"사람의 편성을 되돌려 보냈다. 기록에 「원인 불명의 명중률 저하」라 남을 것이다." — 발리스타', reward:{cores:1}},
{id:'f_hold3', cat:'field', name:'세 번 지킨 집', cond:'플레이어 약탈 격퇴 3회', need:cnt('defWin',3), pre:'"세 번 막으면 그 집은 소문이 나요. 건드리면 손해라고." — 베르타', quote:'"세 번. 금고 문을 두드리던 소리가 줄었다." — 발리스타', reward:{cores:1}},
{id:'f_hold10', cat:'field', name:'철옹성', noPrism:true, cond:'플레이어 약탈 격퇴 10회', need:cnt('defWin',10), pre:'"열 번 막은 집은 지도에서 피해 가요." — 베르타', quote:'"열 번. 약탈 편성이 우리 좌표를 지나쳐 간다." — 발리스타', reward:{cores:2}},
{id:'f_fw1', cat:'fleet', name:'첫 함대전 승리', cond:'함대전 1승', need:cnt('fwWin',1), pre:'"함대전 첫 승. 투영끼리라도 이기는 건 이기는 거다." — 발리스타', quote:'"첫 승. 우리 모함의 투영이 남의 투영을 이겼다 — 원본은 더 강하다." — 발리스타', reward:{alloy:3000}},
{id:'f_fw5', cat:'fleet', name:'다섯 번의 대진', cond:'함대전 5승', need:cnt('fwWin',5), pre:'"함대전 다섯 승. 대진표에 이름이 굵어진다." — 발리스타', quote:'"다섯 번. 상대가 우리 편성을 보고 오기 시작했다." — 발리스타', reward:{cores:1}},
{id:'f_fw10', cat:'fleet', name:'두 자릿수', cond:'함대전 10승', need:cnt('fwWin',10), pre:'"함대전 열 승. 두 자릿수부터는 운으로 설명이 안 돼." — 볼타', quote:'"열 번. 대진표에서 우리 이름을 먼저 찾는 모함이 생겼다." — 발리스타', reward:{cores:1}},
{id:'f_fw15', cat:'fleet', name:'리그의 기억', cond:'함대전 15승', need:cnt('fwWin',15), pre:'"열다섯 승. 리그가 우리를 기억하게 된다." — 발리스타', quote:'"열다섯. 이 기록은 투영이 아니라 지휘관의 것이다." — 발리스타', reward:{cores:2}},
{id:'f_fw30', cat:'fleet', noPrism:true, name:'서른 번의 개전', cond:'함대전 30승', need:cnt('fwWin',30), pre:'"서른 승. 포대 기록판 한 장이 찬다." — 볼타', quote:'"서른. 기록판을 새로 건다." — 볼타', reward:{alloy:5000}},
{id:'f_fw60', cat:'fleet', noPrism:true, name:'예순의 대진표', cond:'함대전 60승', need:cnt('fwWin',60), pre:'"예순 승. 대진표를 넘기는 손이 빨라진다." — 볼타', quote:'"예순. 상대 이름보다 우리 이름을 먼저 찾게 됐다." — 볼타', reward:{alloy:8000}},
{id:'f_fw100', cat:'fleet', noPrism:true, name:'백 번의 포성', cond:'함대전 100승', need:cnt('fwWin',100), pre:'"백 승. 포신 하나를 갈아 끼울 때가 된다." — 볼타', quote:'"백. 포신을 갈았다. 기록은 그대로 둔다." — 볼타', reward:{cores:2}},
{id:'f_fw200', cat:'fleet', noPrism:true, name:'이백의 항적', cond:'함대전 200승', need:cnt('fwWin',200), pre:'"이백 승. 리그가 한 바퀴 돌아도 남는 숫자다." — 볼타', quote:'"이백. 이제 이 숫자가 우리 이름이다." — 볼타', reward:{cores:3}},
{id:'f_fwup', cat:'fleet', name:'판을 뒤집다', cond:'판세 「열세」에서 함대전 승리', need:cnt('fwUpset',1), pre:'"열세라고 적힌 판을 이겨 보면 안다. 판세는 예보일 뿐이다." — 볼타', quote:'"열세였다. 이겼다. 예보를 고칠 필요는 없다 — 우리가 고쳤으니." — 볼타', reward:{cores:1}},
{id:'f_fwl1', cat:'fleet', name:'1부의 승자', cond:'1부 리그에서 함대전 승리', need:cnt('fwLg1',1), pre:'"1부 판에서 한 번. 가장 센 열 척 사이에서." — 볼타', quote:'"1부에서 이겼다. 위에는 이제 없다." — 볼타', reward:{alloy:4000}},
{id:'f_fwl5', cat:'fleet', name:'1부의 단골', cond:'1부 리그에서 함대전 5승', need:cnt('fwLg1',5), pre:'"1부에서 다섯 승. 강한 판에서 이기는 게 진짜야." — 볼타', quote:'"다섯 번. 1부 대진표가 낯설지 않다." — 발리스타', reward:{cores:1}},

{id:'f_fwhum', cat:'fleet', name:'사람끼리', cond:'전원 지휘관 판(표류 모함 없는 판)에서 승리', need:cnt('fwHuman',1), pre:'"표류 모함 없이 열 척 모두 지휘관인 판. 드물게 열린다." — 볼타', quote:'"열 척 모두 사람이었다. 그래서 더 시끄러웠다." — 볼타', reward:{cores:1}},

{id:'f_fwmvp10', cat:'fleet', name:'기함의 자리', noPrism:true, cond:'이긴 함대전에서 우리 팀 기여 1위 10회', need:cnt('fwMvp',10), pre:'"기함 열 번. 그 자리는 이제 네 거야." — 볼타', quote:'"열 번. 대진이 발표되면 모두 우리 모함부터 본다." — 볼타', reward:{cores:2}},

{id:'k_t11', cat:'fleet', srv:true, noPrism:true, name:'아크 제로 너머', cond:'거함 등급 T11 — 아크 제로 격파(개장 改의 시작)', need:bf('rank',11), pre:'"아크 제로. 모든 표류 거함이 호위하던 배. 그 너머는 고쳐 띄운 배들뿐이다." — 소나', quote:'"제로를 넘었다. 이제 돌아오는 배들은 모두 改를 달고 온다." — 소나', reward:{cores:3}},
{id:'k_last', cat:'fleet', srv:true, name:'마지막 일격', cond:'거함을 격파한 포격에서 최다 피해', need:bf('last',1), pre:'"거함이 기울 때 마지막 포탄이 누구 것인지 기록된다." — 볼타', quote:'"마지막 한 발. 기록판에 우리 이름이 맨 아래 — 가장 늦게, 가장 크게." — 볼타', reward:{cores:1}},
{id:'k_van', cat:'fleet', srv:true, name:'선봉', cond:'격파한 날 편대 기여 1위', need:bf('van',1), pre:'"편대의 앞에 서는 배는 하나다." — 볼타', quote:'"선봉. 스무 척이 우리 뒤에서 쐈다." — 볼타', reward:{cores:1}},

{id:'k_solo', cat:'fleet', srv:true, name:'한 포격의 주인', cond:'포격 한 번에서 편대 피해의 20% 이상', need:bf('solo',1), pre:'"스무 척 중 한 척이 5분의 1을 쏘면, 그 포격은 그 배의 것이다." — 볼타', quote:'"그 포격은 우리 것이었다. 나머지 열아홉 척도 안다." — 볼타', reward:{cores:1}},

      <div class="btns"><button class="act ghost" onclick="acClose()">닫기</button></div>`;
else if(mode==='origin') h=`<h2>이미 계정이 있는 모함</h2><p>이 모함는 <b>계정 #${String(S.origin??'?').padStart(4,'0')}</b>의 것이라 새 계정으로 다시 올릴 수 없다(한 모함 = 한 계정). 그 계정의 코드로 불러오거나, 새로 시작하려면 모함을 초기화하라.</p>
      <div class="btns"><button class="act" onclick="acctDialog('link')">코드로 불러오기</button><button class="act ghost" onclick="acClose()">닫기</button></div>`;
else if(S.origin!=null) h=`<h2>계정</h2><p>이 모함는 <b>계정 #${String(S.origin).padStart(4,'0')}</b>의 것이지만 이 기기는 연결이 끊겨 있다. 그 계정의 코드를 입력하면 이어서 저장된다. 새 계정은 만들 수 없다(한 모함 = 한 계정).</p>
      <div class="btns"><button class="act" onclick="acctDialog('link')">코드로 불러오기</button><button class="act ghost" onclick="acClose()">닫기</button></div>`;
else h=`<h2>계정</h2><p>지금은 <b>이 브라우저에만</b> 저장된다. 계정을 만들면 서버에 저장되어 폰·PC에서 이어 할 수 있다. 이메일·비밀번호 없음 — <b>코드 하나</b>가 계정이다.</p>
      <div class="btns"><button class="act" id="acct-create" onclick="cloudCreate()">계정 만들기 (지금 모함을 올림)</button></div>
      <div class="btns"><button class="act ghost" onclick="acctDialog('link')">코드로 불러오기</button><button class="act ghost" onclick="acClose()">닫기</button></div>`;
acEl.innerHTML=`<div class="box">${h}</div>`; if(document.getElementById('sess-list')) sessLoad();
}
const IS_DEV = APP_BUILD.startsWith('__');
let updateShown=false;
async function checkUpdate(){
if(IS_DEV||updateShown) return;
try{
const r=await fetchT('version.json?_='+Date.now(), {cache:'no-store'}); if(!r.ok) return;
const v=await r.json();
if(v.build && v.build!==APP_BUILD) showUpdate(v);
}catch(e){}
}
function showUpdate(v){
updateShown=true; save();
const ov=document.createElement('div'); ov.className='ov'; ovDismiss(ov, ()=>ov.remove());
ov.innerHTML=`<div class="box"><h2>업데이트</h2>
    <p>새 버전이 배포됐습니다. <span class="v">v${APP_VERSION}</span> → <span class="v">v${v.version||'?'}</span><br>진행 상태는 저장돼 있습니다. <span id="cd">15</span>초 후 자동으로 새로고침합니다.</p>
    <button class="act" onclick="applyUpdate()">지금 업데이트</button></div>`;
document.body.appendChild(ov);
let n=15; const t=setInterval(()=>{ n--; const el=document.getElementById('cd'); if(el) el.textContent=n; if(n<=0){ clearInterval(t); applyUpdate(); } },1000);
}
function applyUpdate(){ save(); location.replace(location.pathname+'?v='+Date.now()); }
function whatsNew(){
const seen=localStorage.getItem(KEY+'.seen');
if(seen===APP_VERSION) return;
localStorage.setItem(KEY+'.seen', APP_VERSION);
if(!seen) return;
const c=APP_CHANGELOG[0]; if(!c) return;
const t=document.createElement('div'); t.className='toast'+(isMobile()?' mini':'');
const hd=herald();
const link=`<a href="#" style="color:var(--cyan);font-size:12px" onclick="tab='updates';localStorage.setItem(KEY+'.tab',tab);render();this.closest('.toast').remove();return false">전체 내역</a>`;
t.innerHTML=`<button class="x" onclick="this.parentElement.remove()">✕</button>${isMobile()?`<b>v${c.v}</b> 업데이트됨 · ${link}`:`${hd?`${heraldArt(hd)}<b>${hd.name}</b>: `:''}<b>v${c.v}</b> 업데이트됨 ${link}<ul>${c.items.map(i=>`<li>${i}</li>`).join('')}</ul>`}`;
document.body.appendChild(t); setTimeout(()=>t.remove(), isMobile()?8000:20000);
}
let welEl=null;
function showWelcome(){
welEl=document.createElement('div'); welEl.className='ov wel';
welEl.innerHTML=`<div class="box" style="max-width:380px;text-align:center">
    ${art(['buildings/command'], ICON.command, 'top', '', `style="margin:-22px -24px 14px;width:calc(100% + 48px);border-radius:12px 12px 0 0;aspect-ratio:16/10"`)}
    <h2>HANGAR</h2>
    <div class="wel-nova">   <!-- v0.218.1 게임 소개를 노바의 말투로(사용자) -->
      <p>일어났네, 지휘관.</p>
      <p>여긴 표류하는 모함이야. 항로표에 목적지는 없어 — 이 배가 어디서 왔는지도, 어디로 가는지도 아무도 몰라. 항해 일지 첫 장 승무원 명단엔 사람이 없었어. 이제 한 줄 적을게. 너.</p>
      <p>할 일은 분명해. 소녀들을 격납고에 들이고, 출격 보내서 자원을 싣고 돌아오게 해. 습격은 벽으로 막고, 모함은 한 층씩 키워 가.</p>
      <p>이 우주엔 다른 모함들도 떠 있어. 약탈하러 오기도 하고, 정시가 되면 중계기 너머에서 편대를 맞대기도 해. 가끔은 다 같이 거함을 쫓고.</p>
      <p>서두를 건 없어. 네가 자리를 비워도 배는 돌아가. 나가는 건 네가 정해 — 돌아오는 길은 내가 그릴게.</p>
      <p class="cd wel-sig">— 노바 · 항해 지휘관</p>
    </div>
    <div class="btns" style="flex-direction:column;gap:8px"><button class="act" id="wel-start" onclick="welcomeStart()">새로 시작</button></div>
    <div id="wel-start-err" class="bad" style="font-size:12px;margin-top:6px"></div>
    <div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--line)">
      <p style="margin-bottom:8px">전에 쓰던 항해 일지가 있으면 코드를 줘. 이어서 그릴게.</p>
      <input id="wel-code" placeholder="HGR-XXXX-XXXX-XXXX" autocapitalize="characters" style="width:100%;padding:10px 12px;font-size:14px;letter-spacing:.06em;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--fg);margin-bottom:10px;text-transform:uppercase;font-family:var(--mono)">
      <div id="wel-err" class="bad" style="font-size:12px;margin-bottom:8px"></div>
      <button class="act ghost" style="width:100%" onclick="welcomeLinkGo()">코드로 이어하기</button>
    </div>
  </div>`;
document.body.appendChild(welEl);
}
async function welcomeStart(){
const btn=document.getElementById('wel-start'), err=document.getElementById('wel-start-err');
if(btn){ btn.disabled=true; btn.textContent='서버에 모함을 띄우는 중…'; } if(err) err.textContent='';
try{
const r=await fetchT(API+'account', {method:'POST', headers:{'Content-Type':'application/json', 'X-Device':devId}, body:JSON.stringify({fresh:true})});
let d={}; try{ d=await r.json(); }catch(e){}
if(!r.ok || !d.blob || !d.code) throw new Error(d.error || ('HTTP '+r.status));
cloud.code=d.code; localStorage.setItem(ACCT_KEY, d.code); cloud.token=null; cloud.rev=d.rev; cloud.noRev=false; cloud.status='ok'; cloud.lastPush=Date.now(); cloud.dirtyAt=0;
S=d.blob; S.origin=d.origin; migrate(); setMyPush((d.updated_at||0)*1000);
S.flags=S.flags||{}; S.flags.pinReq=true; save();
log(`☁ 계정 생성 — 코드 ${d.code}. 이 모함은 서버에서 돈다`);
welcomeDone(); setTimeout(()=>acctDialog('pinreq'), 900);
}catch(e){
if(btn){ btn.disabled=false; btn.textContent='다시 시도'; }
if(err) err.textContent = /계정 수/.test(String(e.message))? String(e.message) : '서버에 연결할 수 없다 — 잠시 뒤 다시 시도해 줘';
}
}
let migEl=null;
async function migrateLocal(){
if(!migEl){ migEl=document.createElement('div'); migEl.className='ov wel'; document.body.appendChild(migEl); }
migEl.innerHTML=`<div class="box" style="max-width:380px;text-align:center"><h2>HANGAR</h2><p>이 기기에만 저장된 진행이 있다. 서버로 옮긴 뒤에 이어서 할 수 있다.</p><p class="cd" id="mig-st">서버로 옮기는 중…</p>
    <div class="btns" style="flex-direction:column;gap:8px"><button class="act" id="mig-retry" style="display:none" onclick="migrateLocal()">다시 시도</button></div>
    <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line)"><p style="margin-bottom:8px">이미 코드가 있다면 그 코드로 불러와도 된다</p><button class="act ghost" style="width:100%" onclick="migEl.remove();migEl=null;showWelcome()">코드로 이어하기</button></div></div>`;
await cloudCreate({quiet:true});
if(cloud.code){ migEl.remove(); migEl=null; boot(); return; }
const st=document.getElementById('mig-st'), rb=document.getElementById('mig-retry');
if(st) st.textContent = S.origin!=null? '이 진행은 이미 다른 계정의 것이다 — 그 계정의 코드로 불러와 줘' : '서버에 연결할 수 없다 — 잠시 뒤 다시 시도해 줘';
if(rb && S.origin==null) rb.style.display='';
}
async function welcomeLinkGo(){
const errEl=document.getElementById('wel-err'); errEl.textContent='';
const raw=document.getElementById('wel-code').value;
const code=(raw||'').trim().toUpperCase().replace(/[^A-Z0-9-]/g,'');
if(!/^HGR-[A-Z2-9]{4}-[A-Z2-9]{4}-[A-Z2-9]{4}$/.test(code)){ errEl.textContent='코드 형식이 아니다. HGR-XXXX-XXXX-XXXX'; return; }
try{
let r=await fetchT(API+'save',{headers:{'Authorization':'Bearer '+code, 'X-Device':devId}});
if(r.status===401){ let d={}; try{ d=await r.json(); }catch(e){}
if(d.error==='pin'){
const pin=await gamePrompt('이 계정은 PIN 이 설정돼 있다. 6자리 PIN 을 입력하라', {type:'password', maxlength:6, mono:true, ok:'불러오기', placeholder:'••••••'});
if(pin==null) return;
const lr=await fetchT(API+'login',{method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({code, pin, label:navigator.platform||''})}); const ld=await lr.json();
if(!lr.ok){ errEl.textContent=ld.error||'PIN 오류'; return; }
cloud.token=ld.token; localStorage.setItem(TOK_KEY, ld.token); cloud.pin=true;
r=await fetchT(API+'save',{headers:{'Authorization':'Bearer '+ld.token, 'X-Device':devId}});
} else { errEl.textContent='서버에 없는 코드다.'; return; }
}
if(r.status===404){ errEl.textContent='그 코드엔 아직 저장된 진행이 없다.'; return; }
if(!r.ok) throw new Error('HTTP '+r.status);
const d=await r.json();
cloud.code=code; localStorage.setItem(ACCT_KEY, code);
adoptSave(d.blob); setMyPush((d.updated_at||0)*1000); cloud.status='ok'; cloud.lastPush=Date.now();
log('☁ 코드로 불러옴 — 서버 저장 채택');
welcomeDone();
}catch(e){ errEl.textContent='서버에 연결할 수 없다: '+(e.message||e); }
}
function welcomeDone(){ if(welEl){ welEl.remove(); welEl=null; } boot(); }
const PIN_SUGGEST_TOTAL = 50;
async function pinSuggest(){
if(!cloud.code) return;
if(cloud.pin===null) await pinStatus();
if(cloud.pin) return;
if(S.flags?.pinReq){ acctDialog('pinreq'); return; }
if(S.flags?.pinAsked) return;
if(computeScore().total < PIN_SUGGEST_TOTAL) return;
S.flags=S.flags||{}; S.flags.pinAsked=true; save();
log('<span class="warn">🔒 계정 잠금을 권한다</span> — 지금은 코드만 있으면 누구나 이 모함을 열 수 있다. 계정 창에서 PIN(6자리)을 걸어 두자');
acctDialog('pinsuggest');
}
function boot(){
migrate();
const now=Date.now(), gap=now-S.t;
if(gap>5000) log(`복귀 — ${dur(gap/1000)} 동안 모함이 돌아갔다`);
advance(now);
render();
document.getElementById('ver').textContent=`v${APP_VERSION}${IS_DEV?' · dev':' · '+APP_BUILD.slice(0,7)}`;
if(location.search.startsWith('?v=')) history.replaceState(null,'',location.pathname);
whatsNew();
setInterval(()=>{ if(advance(Date.now())) render(); else refresh(); }, 1000);
checkUpdate(); setInterval(checkUpdate, 60000);
setInterval(()=>{ try{ officerEndCheck(); }catch(e){} }, 30000);
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible'){ checkUpdate(); fwAt=0; if(cloud.code&&!cloud.busy) cloudPull(); } });
updateCloudBadge();
if(cloud.code){ cloudPull().then(r=>{ if(r!=='adopted') cloudPush(); }); prismSync(); }
setInterval(()=>{ if(cloud.code&&cloud.status!=='badcode'&&cloud.status!=='conflict') cloudPush(); }, 30000);
setTimeout(()=>{ if(cloud.code) fetchRanking().then(()=>achCheck()); }, 5000); setInterval(()=>{ if(cloud.code) fetchRanking().then(()=>achCheck()); }, 600000);
setInterval(()=>{ if(cloud.code&&(cloud.status==='locked'||isPassive())&&!cloud.busy) cloudPull(); }, 10000);
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden' && cloud.code && cloud.status!=='badcode'){ save(); cloudPush({keepalive:true}); } });
window.addEventListener('pagehide', ()=>{ if(cloud.code){ save(); cloudPush({keepalive:true}); } });
}
if(!localStorage.getItem(KEY)) showWelcome(); else if(!localStorage.getItem(ACCT_KEY)) migrateLocal(); else boot();
</script>
